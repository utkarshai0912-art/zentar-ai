# Zentar Intelligence — Root nixpacks.toml
# Tells Railway's Railpack that the app lives in /backend
# so it scans backend/ for Python build signals (requirements.txt, runtime.txt, etc.)

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips *"
